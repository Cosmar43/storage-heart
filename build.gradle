plugins {
    id 'java'
}

group = 'com.storageheart'
version = '1.1.0'
description = 'Corazon de almacenamiento central estilo Magic Storage para Hytale (Update 7 / 0.7.x)'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'hytale'
        url = uri('https://maven.hytale.com/release')
    }
}

def hytaleVersion = providers.gradleProperty('hytaleVersion').get()

dependencies {
    // El servidor esta disponible en runtime. No empaquetarlo.
    // Version fijada en gradle.properties (no usar '+').
    compileOnly("com.hypixel.hytale:Server:${hytaleVersion}")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

jar {
    archiveBaseName = 'StorageHeart'
    // src/main/resources ya entra por processResources; evita duplicados.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
